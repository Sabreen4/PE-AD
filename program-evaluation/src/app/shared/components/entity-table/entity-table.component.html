@if (loading()) {
  <app-loading-spinner label="Loading\u2026" />
} @else if (data().length === 0) {
  <app-empty-state icon="table_rows" [title]="emptyTitle()" [hint]="emptyHint()" />
} @else {
  <table mat-table [dataSource]="data()" class="entity-table">
    @for (col of columns(); track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
        <td mat-cell *matCellDef="let row" [class.mono-cell]="col.mono">{{ cellValue(row, col) }}</td>
      </ng-container>
    }

    @if (showEdit() || showDelete()) {
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col"></th>
        <td mat-cell *matCellDef="let row" class="actions-col">
          @if (showEdit()) {
            <button mat-icon-button matTooltip="Edit" (click)="edit.emit(row); $event.stopPropagation()">
              <mat-icon>edit</mat-icon>
            </button>
          }
          @if (showDelete()) {
            <button mat-icon-button matTooltip="Delete" (click)="delete.emit(row); $event.stopPropagation()">
              <mat-icon>delete_outline</mat-icon>
            </button>
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();" (click)="rowClick.emit(row)"></tr>
  </table>
}
