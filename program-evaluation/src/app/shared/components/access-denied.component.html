<div class="error-page">
  <div class="error-card card">
    <h1 class="error-code">{{ labels.errorCode }}</h1>
    <h2 class="error-title">{{ labels.title }}</h2>
    <p class="error-description">{{ labels.description }}</p>
    <a routerLink="/auth/login" class="error-link">{{ labels.linkText }}</a>
  </div>
</div>
