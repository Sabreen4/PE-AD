<nav class="breadcrumb-container" [attr.aria-label]="ariaLabel()">
  <ol class="breadcrumb-list">
    @for (crumb of computedBreadcrumbs(); track crumb.label; let isLast = $last) {
      <li class="breadcrumb-item">
        @if (!isLast && crumb.url) {
          <a [routerLink]="crumb.url" [queryParams]="crumb.queryParams" class="breadcrumb-link">
            {{ crumb.label }}
          </a>
        } @else {
          <span class="breadcrumb-current">{{ crumb.label }}</span>
        }
        @if (!isLast) {
          <svg class="breadcrumb-separator" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        }
      </li>
    }
  </ol>
</nav>
