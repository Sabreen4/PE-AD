
    <div class="leaderboard-container">
      <app-back-nav fallbackRoute="/" />
      <div class="header">
        <h2>Leaderboard</h2>
        <div class="header-controls">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Program</mat-label>
            <mat-select [value]="selectedProgramId()" (valueChange)="onProgramChange($event)">
              <mat-option value="">Select a program</mat-option>
              @for (p of programs(); track p.id) {
                <mat-option [value]="p.id">{{ p.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
          <button mat-raised-button color="primary" (click)="load()" [disabled]="!selectedProgramId()">Refresh</button>
        </div>
      </div>

      @if (loading()) {
        <app-loading-spinner />
      } @else if (entries().length === 0) {
        <app-empty-state message="No leaderboard data available." />
      } @else {
        <table mat-table [dataSource]="entries()" class="mat-elevation-z2">
          <ng-container matColumnDef="rank">
            <th mat-header-cell *matHeaderCellDef>Rank</th>
            <td mat-cell *matCellDef="let e">{{ e.rank }}</td>
          </ng-container>
          <ng-container matColumnDef="employeeName">
            <th mat-header-cell *matHeaderCellDef>Employee</th>
            <td mat-cell *matCellDef="let e">{{ e.employeeName }}</td>
          </ng-container>
          <ng-container matColumnDef="overallScore">
            <th mat-header-cell *matHeaderCellDef>Overall Score</th>
            <td mat-cell *matCellDef="let e">{{ e.overallScore }}</td>
          </ng-container>
          <ng-container matColumnDef="percentile">
            <th mat-header-cell *matHeaderCellDef>Percentile</th>
            <td mat-cell *matCellDef="let e">{{ e.percentile }}%</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      }
    </div>
