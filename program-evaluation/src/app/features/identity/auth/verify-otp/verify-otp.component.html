<div class="form-header">
  <div class="progress-steps">
    <div class="progress-step completed">
      <span class="step-circle">&#10003;</span>
      <span class="step-label">Email</span>
    </div>
    <div class="step-connector"></div>
    <div class="progress-step active">
      <span class="step-circle">2</span>
      <span class="step-label">Verify</span>
    </div>
  </div>
  <h2 class="form-heading">Check your email</h2>
  <p class="form-description" *ngIf="email()">
    We've sent a verification code to&nbsp;<strong>{{ maskedEmail }}</strong>
  </p>
</div>

<div class="verify-form">
  <div class="otp-boxes">
    <input
      #otpInput
      *ngFor="let digit of digits(); let i = index; trackBy: trackByIndex"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      class="otp-box"
      [class.otp-box-filled]="digits()[i] !== ''"
      [value]="digits()[i]"
      [attr.aria-label]="'Digit ' + (i + 1)"
      (input)="onInput(i, $event)"
      (keydown)="onKeydown(i, $event)"
      autocomplete="one-time-code"
    />
  </div>

  <button
    type="button"
    class="btn-primary"
    [disabled]="!isComplete || isLoading()"
    (click)="onSubmit()"
  >
    <span class="btn-content" *ngIf="!isLoading()">{{ labels.submitText }}</span>
    <span class="btn-content" *ngIf="isLoading()">
      <span class="spinner"></span>
      {{ labels.submittingText }}
    </span>
  </button>

  <div class="auth-links">
    <button type="button" class="link-button" (click)="onResendOtp()" [disabled]="isLoading()">
      Resend code
    </button>
    <span class="link-separator">&middot;</span>
    <a routerLink="/auth/login" class="auth-link">{{ labels.backLink }}</a>
  </div>
</div>
