<div class="form-header">
  <h2 class="form-heading">Welcome back</h2>
  <p class="form-description">Sign in to your account to continue</p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
  <div class="form-group">
    <label for="email" class="form-label">{{ labels.emailLabel }}</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      class="form-input"
      [placeholder]="labels.emailPlaceholder"
      [class.input-error]="emailControl.invalid && (emailControl.dirty || emailControl.touched)"
    />
    <div class="validation-error" *ngIf="emailControl.invalid && (emailControl.dirty || emailControl.touched)">
      <span *ngIf="emailControl.errors?.['required']">{{ labels.emailRequired }}</span>
      <span *ngIf="emailControl.errors?.['email']">{{ labels.emailInvalid }}</span>
    </div>
  </div>

  <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading()">
    <span class="btn-content" *ngIf="!isLoading()">{{ labels.submitText }}</span>
    <span class="btn-content" *ngIf="isLoading()">
      <span class="spinner"></span>
      {{ labels.submittingText }}
    </span>
  </button>

  <div class="auth-links">
    <a routerLink="/register/organization" class="auth-link">{{ labels.registerLink }}</a>
  </div>
</form>
