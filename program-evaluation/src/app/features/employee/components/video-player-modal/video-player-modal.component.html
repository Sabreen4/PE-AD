
    @if (visible()) {
      <div class="vp-overlay" (click)="close()">
        <div class="vp-modal" (click)="$event.stopPropagation()">
          <div class="vp-header">
            <div class="vp-header-info">
              <h3 class="vp-title">{{ data()?.title || 'Recorded Session' }}</h3>
              @if (data()?.duration) {
                <span class="vp-duration">{{ data()!.duration }}</span>
              }
            </div>
            <button class="vp-close" (click)="close()">&times;</button>
          </div>
          <div class="vp-body">
            @if (videoSrc(); as src) {
              <video class="vp-video" controls autoplay [src]="src" #videoPlayer>
                Your browser does not support the video tag.
              </video>
            } @else {
              <div class="vp-loading">
                <div class="vp-spinner"></div>
                <span>Loading video...</span>
              </div>
            }
          </div>
          @if (error()) {
            <div class="vp-error">{{ error() }}</div>
          }
        </div>
      </div>
    }
